<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtlasB2B — diagnostic GitHub Pages</title><style>body{background:#f7f6f2;color:#252a24;font-family:system-ui;max-width:730px;margin:4rem auto;padding:20px}h1{color:#94764b}pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;padding:18px;border-radius:10px}a{color:#94764b}</style></head><body><h1>AtlasB2B — diagnostic de publication</h1><p>Cette page peut fonctionner même si React ne démarre pas. Elle vérifie que la version compilée est publiée et que les fichiers JavaScript sont accessibles.</p><pre id="log">Vérification…</pre><a href="./">Retour à AtlasB2B</a><script>
(async()=>{let messages=[];try{const response=await fetch('./index.html',{cache:'no-store'});messages.push('index.html : HTTP '+response.status);const html=await response.text();if(/src\/main\.(jsx|tsx)/.test(html)) messages.push('❌ PROBLÈME : index.html source publié. GitHub Pages doit utiliser GitHub Actions et publier dist/.');else messages.push('✅ index.html n’appelle pas /src/main.jsx');const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m=>m[1]);messages.push('Scripts repérés : '+(scripts.join(', ')||'aucun'));for(const path of scripts){let r=await fetch(path,{method:'HEAD',cache:'no-store'});messages.push((r.ok?'✅ ':'❌ ')+path+' → '+r.status)}if(!scripts.length)messages.push('❌ Aucun script compilé repéré dans index.html');}catch(e){messages.push('❌ Erreur : '+e.message)}document.getElementById('log').textContent=messages.join('\n')})();
</script></body></html>
