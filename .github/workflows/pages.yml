
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Installer les dépendances
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 4. Vérifier les variables Supabase
      - name: Check Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || {
            echo "ERREUR : VITE_SUPABASE_URL manquante"
            exit 1
          }

          test -n "$VITE_SUPABASE_ANON_KEY" || {
            echo "ERREUR : VITE_SUPABASE_ANON_KEY manquante"
            exit 1
          }

          echo "Configuration Supabase detectee"

      # 5. Compiler AtlasB2B
      - name: Build AtlasB2B
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # 6. Préparer GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. Publier les fichiers compilés
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy AtlasB2B

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # 8. Déployer le site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
